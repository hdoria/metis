name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITEST_MAX_WORKERS: '2'
      VITEST_TEST_TIMEOUT_MS: '30000'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate translations
        run: pnpm l10n:validate

      - name: Check Codacy upload credential
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::Set the repository secret CODACY_PROJECT_TOKEN before running coverage upload. See docs/codacy.md."
            exit 1
          fi

      - name: Run application and configuration tests
        env:
          METIS_CI_COVERAGE: '1'
          VITEST_COVERAGE_DIR: coverage/frontend
          METIS_SERVER_COVERAGE_DIR: coverage/server
        run: pnpm test

      - name: Test CodeScene hook
        run: pnpm codescene:test

      - name: Test coverage uploader failure handling
        run: node --test scripts/upload-codacy-coverage.test.mjs

      - name: Test macOS release policy and keychain isolation
        run: node --test scripts/macos-release.test.mjs scripts/macos-release-keychain.test.mjs

      - name: Build frontend
        run: pnpm build

      - name: Upload coverage to Codacy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: bash scripts/upload-codacy-coverage.sh
