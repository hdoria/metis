name: macOS draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching all package versions
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: metis-macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hdoria/metis' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Validate release source and completed quality CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/macos-release.mjs plan "$RELEASE_TAG"
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json headSha,conclusion > "$RUNNER_TEMP/quality-ci.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const runs=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/quality-ci.json","utf8"));
            if(!runs.some(run=>run.headSha===process.env.GITHUB_SHA&&run.conclusion==="success")) throw Error("Successful quality CI required for this exact commit");'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required release credentials
        env:
          METIS_APPLE_CERTIFICATE: ${{ secrets.METIS_APPLE_CERTIFICATE }}
          METIS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.METIS_APPLE_CERTIFICATE_PASSWORD }}
          METIS_APPLE_NOTARY_PASSWORD: ${{ secrets.METIS_APPLE_NOTARY_PASSWORD }}
          METIS_SENTRY_AUTH_TOKEN: ${{ secrets.METIS_SENTRY_AUTH_TOKEN }}
          METIS_SENTRY_DESKTOP_DSN: ${{ secrets.METIS_SENTRY_DESKTOP_DSN }}
          METIS_SENTRY_NATIVE_DSN: ${{ secrets.METIS_SENTRY_NATIVE_DSN }}
          METIS_TLDRAW_LICENSE_KEY: ${{ secrets.METIS_TLDRAW_LICENSE_KEY }}
        run: |
          for key in METIS_APPLE_CERTIFICATE METIS_APPLE_CERTIFICATE_PASSWORD METIS_APPLE_NOTARY_PASSWORD METIS_SENTRY_AUTH_TOKEN METIS_SENTRY_DESKTOP_DSN METIS_SENTRY_NATIVE_DSN METIS_TLDRAW_LICENSE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key. See docs/macos-release.md."
              exit 1
            fi
          done

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin

      - name: Install verified Sentry CLI
        run: |
          curl --fail --show-error --silent --location 'https://github.com/getsentry/toolkit/releases/download/cli%400.49.0/sentry-darwin-arm64' --output "$RUNNER_TEMP/sentry"
          printf '831e5707fec3495232d400de6e03d168644b4c29cc9fc725ecb6abd96078ab9c  %s\n' "$RUNNER_TEMP/sentry" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/sentry"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test release guards
        run: node --test scripts/macos-release.test.mjs scripts/macos-release-keychain.test.mjs

      - name: Import disposable signing keychain
        env:
          METIS_APPLE_CERTIFICATE: ${{ secrets.METIS_APPLE_CERTIFICATE }}
          METIS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.METIS_APPLE_CERTIFICATE_PASSWORD }}
          METIS_APPLE_NOTARY_PASSWORD: ${{ secrets.METIS_APPLE_NOTARY_PASSWORD }}
        run: node scripts/macos-release-keychain.mjs setup

      - name: Build, upload symbols, sign, notarize and verify
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SENTRY_DSN: ${{ secrets.METIS_SENTRY_DESKTOP_DSN }}
          SENTRY_DSN: ${{ secrets.METIS_SENTRY_NATIVE_DSN }}
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.METIS_TLDRAW_LICENSE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.METIS_SENTRY_AUTH_TOKEN }}
          SENTRY_FORCE_ENV_TOKEN: '1'
          SENTRY_ORG: popcode
          SENTRY_FRONTEND_PROJECT: metis-desktop
          SENTRY_NATIVE_PROJECT: metis-native
        run: node scripts/macos-release.mjs build "$RELEASE_TAG"

      - name: Attach verified installer to private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/macos-release.mjs draft "$RELEASE_TAG"

      - name: Remove disposable signing keychain
        if: always()
        run: node scripts/macos-release-keychain.mjs cleanup
